<!DOCTYPE html>
<html ng-app="test" ng-jq>
  <body>
    <span ng-bind="jqueryVersion">{{jqueryVersion}}</span>

    <script src="http://localhost:4200/vendor/jquery/jquery.js"></script>
    <script type="text/javascript">
      // Verify that empty ng-jq is not accessing `window['']`.
      // (See https://github.com/angular/angular.js/issues/12741 for more details)
      window[''] = window.jQuery;
    </script>
    <script src="http://localhost:4200/dist/angular/angular.js"></script>
    <script src="http://localhost:4200/ng-jq/script.js"></script>
  </body>
</html>
